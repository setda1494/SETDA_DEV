services:
  postgres:
    image: postgres:17-alpine
    container_name: setda-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: setda_dev
      POSTGRES_USER: setda_dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-setda_dev_local_only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - setda_dev_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U setda_dev -d setda_dev"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  setda_dev_pgdata:
